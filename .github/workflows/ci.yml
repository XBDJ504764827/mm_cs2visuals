name: Build and Release

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check changed lines
        run: git diff --check HEAD^ HEAD
      - name: Validate build scripts and metadata
        run: |
          python3 -m py_compile configure.py AMBuildScript AMBuilder PackageScript
          python3 -m json.tool plugin-metadata.json >/dev/null

  version:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version for main
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF}" == "refs/heads/main" && "${GITHUB_EVENT_NAME}" == "push" ]]; then
            existing="$(git tag --points-at "${GITHUB_SHA}" --list 'v*' | head -n 1 || true)"
            if [[ -n "${existing}" ]]; then
              tag="${existing}"
            else
              latest="$(git tag --list 'v*' --sort=-version:refname | head -n 1 || true)"
              if [[ -z "${latest}" ]]; then
                tag="v0.1.0"
              else
                version="${latest#v}"
                IFS=. read -r major minor patch <<< "${version}"
                tag="v${major}.${minor}.$((patch + 1))"
              fi
            fi
            echo "version=${tag#v}" >> "${GITHUB_OUTPUT}"
            echo "release=true" >> "${GITHUB_OUTPUT}"
          else
            echo "version=0.0.0-ci" >> "${GITHUB_OUTPUT}"
            echo "release=false" >> "${GITHUB_OUTPUT}"
          fi

  build-linux:
    name: Linux
    needs: version
    runs-on: ubuntu-latest
    container:
      image: registry.gitlab.steamos.cloud/steamrt/sniper/sdk:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - name: Initialize SDK submodules
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git submodule update --init --recursive metamod-source hl2sdk-cs2
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y python3 python3-pip
      - name: Install AMBuild
        run: |
          git clone --depth=1 https://github.com/alliedmodders/ambuild.git /tmp/ambuild
          python3 -m pip install /tmp/ambuild
      - name: Configure
        env:
          CS2VISUALS_VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p build
          cd build
          python3 ../configure.py --sdks cs2 --targets x86_64 --mms_path ../metamod-source --hl2sdk-manifests ../metamod-source/hl2sdk-manifests --enable-optimize
      - name: Build
        working-directory: build
        run: ambuild
      - name: Validate package layout
        run: |
          test -f build/package/addons/metamod/cs2visuals.vdf
          test -f build/package/addons/cs2visuals/bin/linuxsteamrt64/cs2visuals.so
          test -f build/package/cfg/cs2visuals/cs2visuals.cfg
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cs2visuals-linux
          path: build/package

  build-windows:
    name: Windows
    needs: version
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      - name: Initialize SDK submodules
        shell: bash
        run: |
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"
          git submodule update --init --recursive metamod-source hl2sdk-cs2
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
      - name: Install AMBuild
        shell: bash
        run: |
          git clone --depth=1 https://github.com/alliedmodders/ambuild.git "$RUNNER_TEMP/ambuild"
          python -m pip install "$RUNNER_TEMP/ambuild"
      - name: Configure
        env:
          CS2VISUALS_VERSION: ${{ needs.version.outputs.version }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          Set-Location build
          python ../configure.py --sdks cs2 --targets x86_64 --mms_path ../metamod-source --hl2sdk-manifests ../metamod-source/hl2sdk-manifests --enable-optimize
      - name: Build
        working-directory: build
        run: ambuild
      - name: Validate package layout
        shell: pwsh
        run: |
          if (!(Test-Path build/package/addons/metamod/cs2visuals.vdf)) { exit 1 }
          if (!(Test-Path build/package/addons/cs2visuals/bin/win64/cs2visuals.dll)) { exit 1 }
          if (!(Test-Path build/package/cfg/cs2visuals/cs2visuals.cfg)) { exit 1 }
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cs2visuals-windows
          path: build/package

  release:
    name: Publish GitHub Release
    if: needs.version.outputs.release == 'true'
    needs: [quality, version, build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download Linux package
        uses: actions/download-artifact@v8
        with:
          name: cs2visuals-linux
          path: cs2visuals-linux
      - name: Download Windows package
        uses: actions/download-artifact@v8
        with:
          name: cs2visuals-windows
          path: cs2visuals-windows
      - name: Create archives
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd cs2visuals-linux && zip -r "../cs2visuals-${VERSION}-linux.zip" . && cd ..
          cd cs2visuals-windows && zip -r "../cs2visuals-${VERSION}-windows.zip" .
      - name: Create version tag
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          if ! git rev-parse --verify "refs/tags/${tag}" >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${tag}" "${GITHUB_SHA}" -m "Release ${tag}"
            git push origin "${tag}"
          fi
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: CS2 Visuals v${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: |
            cs2visuals-${{ needs.version.outputs.version }}-linux.zip
            cs2visuals-${{ needs.version.outputs.version }}-windows.zip
